{% extends "base.html" %}
{% block content %}
<h1>{{ "Editar Tutor" if tutor else "Novo Tutor" }}</h1>

<form method="POST">
    <div class="mb-3">
        <label for="nome" class="form-label">Nome *</label>
        <input type="text" class="form-control" id="nome" name="nome"
            value="{{ tutor.nome if tutor else '' }}" required>
    </div>
    <div class="mb-3">
        <label for="telefone" class="form-label">Telefone</label>
        <input type="text" class="form-control" id="telefone" name="telefone"
            value="{{ tutor.telefone if tutor else '' }}">
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email"
            value="{{ tutor.email if tutor else '' }}">
    </div>
    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="{{ url_for('tutores.listar') }}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
